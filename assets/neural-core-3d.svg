<svg xmlns="http://www.w3.org/2000/svg" width="380" height="320" viewBox="0 0 380 320" fill="none" role="img" aria-label="Rotating 3D neural core">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.4" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes spinR  { to { transform: rotate(-360deg); } }
      @keyframes breathe{ 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.12);} }
      .o1 { transform-origin:190px 160px; animation: spin 7s linear infinite; }
      .o2 { transform-origin:190px 160px; animation: spinR 9s linear infinite; }
      .o3 { transform-origin:190px 160px; animation: spin 11s linear infinite; }
      .core{ transform-origin:190px 160px; animation: breathe 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="380" height="320" rx="16" fill="#0a0e1a"/>
  <rect x="1" y="1" width="378" height="318" rx="15" fill="none" stroke="#1b2942"/>
  <ellipse cx="190" cy="160" rx="150" ry="150" fill="url(#halo)"/>

  <!-- orbit ring 1 (wide, flat) -->
  <g class="o1">
    <ellipse cx="190" cy="160" rx="135" ry="46" fill="none" stroke="url(#ringA)" stroke-width="2"/>
    <circle cx="55" cy="160" r="4.5" fill="#67e8f9"/>
    <circle cx="325" cy="160" r="3" fill="#a5f3fc"/>
  </g>

  <!-- orbit ring 2 (tilted) -->
  <g class="o2">
    <ellipse cx="190" cy="160" rx="48" ry="132" fill="none" stroke="url(#ringB)" stroke-width="2"/>
    <circle cx="190" cy="28" r="4" fill="#fb7185"/>
    <circle cx="190" cy="292" r="3" fill="#fda4af"/>
  </g>

  <!-- orbit ring 3 (diagonal) -->
  <g class="o3" transform="rotate(45 190 160)">
    <ellipse cx="190" cy="160" rx="120" ry="60" fill="none" stroke="url(#ringA)" stroke-width="1.6" opacity="0.7"/>
    <circle cx="70" cy="160" r="3.5" fill="#67e8f9"/>
  </g>

  <!-- pulsing core -->
  <g class="core">
    <circle cx="190" cy="160" r="26" fill="url(#core)"/>
    <circle cx="190" cy="160" r="26" fill="none" stroke="#a5f3fc" stroke-width="1" opacity="0.6"/>
    <circle cx="182" cy="152" r="7" fill="#e0fbff" opacity="0.7"/>
  </g>
</svg>
