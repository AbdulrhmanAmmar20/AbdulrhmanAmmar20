<style>
@keyframes hd-spin{to{transform:rotate(360deg)}}
@keyframes hd-spinR{to{transform:rotate(-360deg)}}
@keyframes hd-pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.18);opacity:1}}
@keyframes hd-ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes hd-blob{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}
@keyframes hd-blob2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,16px)}}
@keyframes hd-up{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
@keyframes hd-streak{0%{transform:translateX(-260px);opacity:0}8%{opacity:1}55%{opacity:1}100%{transform:translateX(1100px);opacity:0}}
@keyframes hd-blink{0%,55%{opacity:1}75%,100%{opacity:0}}
@keyframes hd-bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes hd-shine{0%{transform:translateX(-260px)}100%{transform:translateX(500px)}}
.hd-rays{transform-origin:200px 150px;animation:hd-spin 9s linear infinite}
.hd-rays2{transform-origin:200px 150px;animation:hd-spinR 14s linear infinite}
.hd-core{transform-box:fill-box;transform-origin:center;animation:hd-pulse 1.7s ease-in-out infinite}
.hd-r{transform-box:fill-box;transform-origin:center;animation:hd-ring 2.4s ease-out infinite}
.hd-o1{transform-origin:200px 150px;animation:hd-spin 3.2s linear infinite}
.hd-o2{transform-origin:200px 150px;animation:hd-spinR 4.4s linear infinite}
.hd-o3{transform-origin:200px 150px;animation:hd-spin 5.6s linear infinite}
.blob1{transform-box:fill-box;transform-origin:center;animation:hd-blob 10s ease-in-out infinite}
.blob2{transform-box:fill-box;transform-origin:center;animation:hd-blob2 12s ease-in-out infinite}
.cur{animation:hd-blink 1.1s step-end infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:hd-bar 1s ease-in-out infinite}
.shine{animation:hd-shine 3s ease-in-out infinite}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.sans{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
</style>
