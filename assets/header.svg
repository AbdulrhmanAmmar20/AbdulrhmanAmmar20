<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none" role="img" aria-label="Abdulrahman Ammar - Software Engineer, AI and Computer Vision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#08101c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#fb7185"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      @keyframes flick { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: flick 1s step-end infinite; }
      @keyframes drift { from{transform:translateY(0)} to{transform:translateY(-26px)} }
      @keyframes pulse { 0%,100%{r:3.2; opacity:.9} 50%{r:5.2; opacity:1} }
      .node { animation: pulse 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1b2942" stroke-width="1.5"/>

  <!-- faint grid -->
  <g stroke="#16314d" stroke-width="1" opacity="0.5">
    <path d="M0 60H900M0 120H900M0 180H900M0 240H900"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300"/>
  </g>

  <!-- glow behind net -->
  <ellipse cx="230" cy="150" rx="200" ry="150" fill="url(#glow)"/>

  <!-- ===== neural network ===== -->
  <g stroke-width="1.4" fill="none">
    <!-- connections L1->L2 -->
    <g stroke="#1f4a63" opacity="0.8">
      <path d="M110 90 L235 70"/><path d="M110 90 L235 150"/><path d="M110 90 L235 230"/>
      <path d="M110 150 L235 70"/><path d="M110 150 L235 150"/><path d="M110 150 L235 230"/>
      <path d="M110 210 L235 70"/><path d="M110 210 L235 150"/><path d="M110 210 L235 230"/>
    </g>
    <!-- connections L2->L3 -->
    <g stroke="#1f4a63" opacity="0.8">
      <path d="M235 70 L360 110"/><path d="M235 70 L360 190"/>
      <path d="M235 150 L360 110"/><path d="M235 150 L360 190"/>
      <path d="M235 230 L360 110"/><path d="M235 230 L360 190"/>
    </g>
  </g>

  <!-- traveling signal pulses -->
  <g fill="#67e8f9">
    <circle r="2.6">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M110 150 L235 70"/>
    </circle>
    <circle r="2.6">
      <animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M110 90 L235 150"/>
    </circle>
    <circle r="2.6" fill="#fb7185">
      <animateMotion dur="2s" begin="0.9s" repeatCount="indefinite" path="M235 150 L360 110"/>
    </circle>
    <circle r="2.6" fill="#fb7185">
      <animateMotion dur="2.4s" begin="0.2s" repeatCount="indefinite" path="M235 230 L360 190"/>
    </circle>
    <circle r="2.6">
      <animateMotion dur="2.1s" begin="1.1s" repeatCount="indefinite" path="M110 210 L235 230"/>
    </circle>
  </g>

  <!-- nodes -->
  <g fill="#0a0e1a" stroke="#22d3ee" stroke-width="1.8">
    <circle class="node" cx="110" cy="90"/>
    <circle class="node" cx="110" cy="150" style="animation-delay:.3s"/>
    <circle class="node" cx="110" cy="210" style="animation-delay:.6s"/>
    <circle class="node" cx="235" cy="70"  style="animation-delay:.2s"/>
    <circle class="node" cx="235" cy="150" style="animation-delay:.5s"/>
    <circle class="node" cx="235" cy="230" style="animation-delay:.8s"/>
    <circle class="node" cx="360" cy="110" stroke="#fb7185" style="animation-delay:.4s"/>
    <circle class="node" cx="360" cy="190" stroke="#fb7185" style="animation-delay:.9s"/>
  </g>

  <!-- ===== YOLO-style detection boxes ===== -->
  <g class="mono" font-size="10" font-weight="600">
    <!-- box 1 -->
    <g>
      <rect x="60" y="55" width="120" height="100" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="4 4">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.4;0.5" dur="6s" repeatCount="indefinite"/>
      </rect>
      <g>
        <rect x="60" y="44" width="86" height="13" fill="#22d3ee"/>
        <text x="63" y="54" fill="#04121a">neuron 0.98</text>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.4;0.5" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- box 2 -->
    <g>
      <rect x="200" y="120" width="180" height="110" rx="3" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="4 4">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.85;0.95" dur="6s" repeatCount="indefinite"/>
      </rect>
      <g>
        <rect x="200" y="109" width="96" height="13" fill="#fb7185"/>
        <text x="203" y="119" fill="#1a0509">network 0.94</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.85;0.95" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- vertical scan line over the net -->
  <rect x="40" y="40" width="2" height="230" fill="#67e8f9" opacity="0.7" filter="url(#soft)">
    <animate attributeName="x" values="40;380;40" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting particles -->
  <g fill="#22d3ee" opacity="0.5">
    <circle cx="500" cy="260" r="1.5" style="animation:drift 3s ease-in-out infinite alternate"/>
    <circle cx="640" cy="270" r="1.2" style="animation:drift 4s ease-in-out infinite alternate"/>
    <circle cx="760" cy="255" r="1.6" style="animation:drift 3.4s ease-in-out infinite alternate"/>
    <circle cx="820" cy="265" r="1.1" style="animation:drift 4.6s ease-in-out infinite alternate"/>
  </g>

  <!-- ===== text block ===== -->
  <g class="sans">
    <text x="432" y="116" font-size="34" font-weight="800" fill="url(#name)">Abdulrahman Ammar</text>
    <text x="434" y="116" font-size="34" font-weight="800" fill="#22d3ee" opacity="0.1">Abdulrahman Ammar</text>
  </g>
  <g class="mono" font-size="15" fill="#9fb3c8">
    <text x="434" y="148">
      <tspan fill="#22d3ee">&gt;</tspan> Software Engineer
    </text>
    <text x="434" y="174" fill="#7e93a8">AI &amp; Computer Vision Enthusiast<tspan class="cursor" fill="#fb7185" dx="2">_</tspan></text>
  </g>

  <!-- chips -->
  <g class="mono" font-size="11" font-weight="600">
    <g transform="translate(434,198)">
      <rect width="78" height="22" rx="11" fill="#0e1f33" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="12" y="15" fill="#67e8f9">KFUPM</text>
    </g>
    <g transform="translate(522,198)">
      <rect width="74" height="22" rx="11" fill="#0e1f33" stroke="#fb7185" stroke-opacity="0.5"/>
      <text x="11" y="15" fill="#fda4af">YOLO</text>
    </g>
    <g transform="translate(606,198)">
      <rect width="92" height="22" rx="11" fill="#0e1f33" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="11" y="15" fill="#67e8f9">React · Node</text>
    </g>
  </g>
</svg>
