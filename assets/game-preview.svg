<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" fill="none" role="img" aria-label="Detect the Object — live game preview">
  <defs>
    <linearGradient id="gp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1424"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <pattern id="gp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2942" stroke-width="1"/>
    </pattern>
    <filter id="gp-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .mono { font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace; }
      .pop  { font-family:"SFMono-Regular",Consolas,monospace; font-weight:700; }
    </style>
  </defs>

  <!-- frame -->
  <rect x="2" y="2" width="756" height="376" rx="14" fill="url(#gp-bg)" stroke="#1b2942" stroke-width="1.5"/>
  <rect x="14" y="44" width="732" height="322" rx="10" fill="url(#gp-grid)" opacity="0.6"/>
  <rect x="14" y="44" width="732" height="322" rx="10" fill="none" stroke="#1b2942"/>

  <!-- HUD -->
  <g class="mono" font-size="14" font-weight="700">
    <text x="22" y="30" fill="#cfe3f5">&gt; detect<tspan fill="#22d3ee">.the.object</tspan>()</text>
    <text x="560" y="30" fill="#7e93a8" font-size="12">SCORE
      <tspan fill="#67e8f9" font-size="14"> </tspan>
    </text>
    <!-- score counter swap -->
    <g font-size="14" fill="#67e8f9">
      <text x="612" y="30"><animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.24;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>0</text>
      <text x="612" y="30"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="8s" repeatCount="indefinite"/>1</text>
      <text x="612" y="30"><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="8s" repeatCount="indefinite"/>2</text>
      <text x="612" y="30" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1" keyTimes="0;0.24;0.5;0.74;0.99;1" dur="8s" repeatCount="indefinite"/>3</text>
    </g>
    <text x="648" y="30" fill="#7e93a8" font-size="12">LIVES</text>
    <text x="700" y="30" fill="#fb7185" font-size="14" letter-spacing="2">●●●</text>
  </g>

  <!-- moving scan line -->
  <rect x="14" y="44" width="732" height="2" fill="#67e8f9" opacity="0.7" filter="url(#gp-soft)">
    <animate attributeName="y" values="50;360;50" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Detection box 1 (cyan) — appears, gets clicked ===== -->
  <g>
    <animate attributeName="opacity" values="0;1;1;1;0;0;0;0" keyTimes="0;0.04;0.20;0.24;0.27;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    <rect x="120" y="110" width="150" height="110" rx="3" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="120" y="96" width="104" height="15" fill="#22d3ee"/>
    <text x="126" y="108" class="mono" font-size="11" font-weight="700" fill="#04121a">neuron 0.98</text>
    <!-- corners -->
    <path d="M120 122V110H132 M270 110H258 M270 110V122 M120 208V220H132 M270 220H258 M270 220V208" stroke="#67e8f9" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ===== Detection box 2 (coral) ===== -->
  <g>
    <animate attributeName="opacity" values="0;0;0;1;1;1;0;0" keyTimes="0;0.28;0.30;0.34;0.5;0.53;0.56;1" dur="8s" repeatCount="indefinite"/>
    <rect x="420" y="170" width="180" height="120" rx="3" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="420" y="156" width="96" height="15" fill="#fb7185"/>
    <text x="426" y="168" class="mono" font-size="11" font-weight="700" fill="#1a0509">crate 0.91</text>
    <path d="M420 182V170H432 M600 170H588 M600 170V182 M420 278V290H432 M600 290H588 M600 290V278" stroke="#fda4af" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ===== Detection box 3 (cyan) ===== -->
  <g>
    <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.5;0.55;0.6;0.62;0.66;0.82;0.9" dur="8s" repeatCount="indefinite"/>
    <rect x="250" y="240" width="140" height="95" rx="3" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="250" y="226" width="98" height="15" fill="#22d3ee"/>
    <text x="256" y="238" class="mono" font-size="11" font-weight="700" fill="#04121a">tensor 0.95</text>
    <path d="M250 252V240H262 M390 240H378 M390 240V252 M250 323V335H262 M390 335H378 M390 335V323" stroke="#67e8f9" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ===== +1 / +1 pops ===== -->
  <text x="186" y="165" class="pop" font-size="18" fill="#67e8f9" opacity="0">+1
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.24;0.27;0.34;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="165;165;150;138;138" keyTimes="0;0.24;0.27;0.34;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="230" class="pop" font-size="18" fill="#fda4af" opacity="0">+1
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.49;0.52;0.59;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="230;230;215;203;203" keyTimes="0;0.49;0.52;0.59;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- ===== animated cursor ===== -->
  <g>
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.25;0.25;0.5;0.5;0.75;0.75;1"
      keyTimes="0;0.24;0.27;0.49;0.52;0.74;0.77;1"
      path="M520 320 L195 165 L195 165 L510 230 L510 230 L320 290 L320 290 L520 320"/>
    <path d="M0 0 L0 18 L5 13 L9 21 L12 19 L8 12 L15 12 Z" fill="#ffffff" stroke="#04121a" stroke-width="1"/>
    <!-- click ring -->
    <circle r="0" fill="none" stroke="#67e8f9" stroke-width="2">
      <animate attributeName="r" values="0;0;14;0" keyTimes="0;0.24;0.30;0.31" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.24;0.30;0.31" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- caption -->
  <text x="380" y="362" text-anchor="middle" class="mono" font-size="11" fill="#7e93a8">auto-demo · click the boxes before they fade — full game is playable ▶</text>
</svg>
