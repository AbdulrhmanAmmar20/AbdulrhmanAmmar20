.shine{animation:hd-shine 3s ease-in-out infinite}
.bglow{animation:hd-glow 2.2s ease-in-out infinite}
.stage{transform-origin:170px 175px;animation:hd-enter 12s ease-out infinite}
.g0{animation:hd-g0 12s linear infinite}
.g1{animation:hd-g1 12s linear infinite}
.g2{animation:hd-g2 12s linear infinite}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.sans{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
</style>
